services:
  - type: web
    name: mvlt-ai-service
    runtime: python
    region: oregon  # Change to your preferred region
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: APP_NAME
        value: MVLT AI Service
      - key: APP_VERSION
        value: 0.1.0
      - key: APP_DEBUG
        value: false
      - key: CORS_ORIGINS
        value: "*"  # Allow all origins (as requested)
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5
      - key: CLAUDE_MAX_TOKENS
        value: 1000
      - key: CLAUDE_TEMPERATURE
        value: 0.7
      - key: MAX_ENTRY_CONTENT_LENGTH
        value: 10000
      - key: MAX_CHAT_MESSAGE_LENGTH
        value: 5000
      - key: MAX_TITLE_CONTENT_LENGTH
        value: 1500
